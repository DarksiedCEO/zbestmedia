name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Verify pnpm on PATH
        run: which pnpm && pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Schemas
        run: |
          pnpm schemas:gen
          pnpm schemas:check

      - name: Quality Gates
        run: |
          pnpm -r lint
          pnpm -r typecheck
          pnpm -r test
