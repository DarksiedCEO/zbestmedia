name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR workflows otherwise check out GitHub's synthetic merge commit,
          # which cannot be used as exact candidate identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Verify pnpm on PATH
        run: which pnpm && pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify required package scripts
        run: node .github/scripts/verify-scripts.mjs

      - name: Prisma generate (if present)
        run: |
          if ls services/*/prisma/schema.prisma >/dev/null 2>&1; then
            pnpm -r --if-present prisma:generate
          else
            echo "No Prisma schemas found"
          fi

      - name: Verify tsconfig workspace boundaries
        run: node .github/scripts/verify-tsconfig.mjs

      - name: Schemas
        run: |
          pnpm schemas:gen
          pnpm schemas:check

      - name: P0 reconciliation fail-closed aggregate
        env:
          P0_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm test:p0-reconciliation

      - name: P1-A trusted-bootstrap exact-SHA identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf '%s\n' "Bootstrap CI exact SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: P1-A trusted verifier controls
        run: node scripts/test-p1a-trusted-verifier.mjs

      - name: P1-A trusted-bootstrap Node syntax
        run: |
          node --check scripts/detect-p1a-ordinary-ci-secrets.mjs
          node --check scripts/test-p1a-ci-secret-detector.mjs
          node --check scripts/test-p1a-trusted-verifier.mjs
          node --check scripts/validate-p1a-threat-model.mjs

      - name: P1-A trusted-bootstrap secret-detector tests
        run: node scripts/test-p1a-ci-secret-detector.mjs

      - name: P1-A trusted-bootstrap secret-exposure scan
        run: |
          node scripts/detect-p1a-ordinary-ci-secrets.mjs \
            --workflow .github/workflows/ci.yml

      - name: P1-A private cross-repository suites are intentionally unavailable
        run: |
          {
            echo "### P1-A bootstrap pre-merge accounting"
            echo
            echo "- Trusted verifier controls: executed remotely"
            echo "- Frozen-candidate integration 21/21: **NOT_RUN pre-merge**"
            echo "- Nested trusted verification 15/15: **NOT_RUN pre-merge**"
            echo "- Reason: private cross-repository evidence is intentionally unavailable to unprivileged CI"
            echo "- Fixtures are not equivalent cross-repository proof"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: P1-A workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          files: ".github/workflows/*.yml,.github/workflows/*.yaml"

      - name: Quality Gates
        run: |
          pnpm -r lint
          pnpm -r typecheck
          pnpm -r test
