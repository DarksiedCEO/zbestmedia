name: P1-A Trusted Certification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character P1-A candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p1a-certification-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    environment: p1a-certification
    steps:
      - name: Validate immutable dispatch identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVIDENCE_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          RECONCILIATION_BASE_SHA: 5056fb0df6e1ef739231cd2273a453fb1c644273
          ORIGINAL_CANDIDATE_SHA: 365c59757756f3f91480d3bfeb841b543010201f
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::candidate_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::github.workflow_sha is not an exact commit"
            exit 1
          }
          for identity in "$EVIDENCE_BASE_SHA" "$RECONCILIATION_BASE_SHA" "$ORIGINAL_CANDIDATE_SHA" "$WORKFLOW_SHA"; do
            [[ "$identity" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
          test "$REPOSITORY" = "DarksiedCEO/zbestmedia"

      - name: Checkout trusted verifier at workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate as untrusted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted and candidate identities
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVIDENCE_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          RECONCILIATION_BASE_SHA: 5056fb0df6e1ef739231cd2273a453fb1c644273
          ORIGINAL_CANDIDATE_SHA: 365c59757756f3f91480d3bfeb841b543010201f
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate remote get-url origin)" = \
            "https://github.com/DarksiedCEO/zbestmedia"
          for identity in "$EVIDENCE_BASE_SHA" "$RECONCILIATION_BASE_SHA" "$ORIGINAL_CANDIDATE_SHA"; do
            test "$(git -C candidate cat-file -t "$identity")" = "commit"
          done
          git -C candidate merge-base --is-ancestor "$EVIDENCE_BASE_SHA" "$ORIGINAL_CANDIDATE_SHA"
          git -C candidate merge-base --is-ancestor "$EVIDENCE_BASE_SHA" "$RECONCILIATION_BASE_SHA"
          git -C candidate merge-base --is-ancestor "$RECONCILIATION_BASE_SHA" "$CANDIDATE_SHA"
          git -C candidate merge-base --is-ancestor "$WORKFLOW_SHA" "$CANDIDATE_SHA"
          git -C candidate merge-base --is-ancestor "$ORIGINAL_CANDIDATE_SHA" "$CANDIDATE_SHA"
          echo "P1A_VERIFIER_SHA=$WORKFLOW_SHA" >> "$GITHUB_ENV"

      - name: Execute protected dual-base controls
        env:
          P1A_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          P1A_WORKFLOW_SHA: ${{ github.workflow_sha }}
          P1A_TRUST_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          P1A_EVIDENCE_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          P1A_RECONCILIATION_BASE_SHA: 5056fb0df6e1ef739231cd2273a453fb1c644273
          P1A_ORIGINAL_CANDIDATE_SHA: 365c59757756f3f91480d3bfeb841b543010201f
          P1A_TRUST_RUNTIME_PIN: ${{ vars.P1A_TRUST_RUNTIME_PIN }}
        run: |
          set -euo pipefail
          node trusted/scripts/test-p1a-dual-base-verifier.mjs |
            tee "$RUNNER_TEMP/p1a-dual-base.log"
          tail -n 1 "$RUNNER_TEMP/p1a-dual-base.log" \
            > "$RUNNER_TEMP/p1a-dual-base-summary.json"

      - name: Mint short-lived read-only runtime token
        id: runtime_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.P1A_RUNTIME_APP_ID }}
          private-key: ${{ secrets.P1A_RUNTIME_APP_PRIVATE_KEY }}
          owner: DarksiedCEO
          repositories: zbestmedia-ui
          permission-contents: read

      - name: Fetch exact runtime pin into isolated object store
        env:
          RUNTIME_TOKEN: ${{ steps.runtime_token.outputs.token }}
          RUNTIME_PIN: ${{ vars.P1A_TRUST_RUNTIME_PIN }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_PIN" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::P1A_TRUST_RUNTIME_PIN must be an exact commit"
            exit 1
          }
          RUNTIME_GIT_DIR="$RUNNER_TEMP/zbestmedia-ui.git"
          ASKPASS="$RUNNER_TEMP/p1a-askpass.sh"
          git init --bare -q "$RUNTIME_GIT_DIR"
          # shellcheck disable=SC2016
          printf '#!/usr/bin/env bash\ncase "$1" in Username*) echo x-access-token;; Password*) echo "$RUNTIME_TOKEN";; esac\n' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
            git -C "$RUNTIME_GIT_DIR" fetch --depth=1 --no-tags \
              "https://github.com/DarksiedCEO/zbestmedia-ui.git" "$RUNTIME_PIN"
          test "$(git -C "$RUNTIME_GIT_DIR" cat-file -t "$RUNTIME_PIN")" = "commit"
          echo "P1A_RUNTIME_GIT_DIR=$RUNTIME_GIT_DIR" >> "$GITHUB_ENV"

      - name: Execute protected verifier against candidate data
        env:
          P1A_PACKAGE_ROOT: ${{ github.workspace }}/candidate
          P1A_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          P1A_WORKFLOW_SHA: ${{ github.workflow_sha }}
          P1A_TRUST_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          P1A_EVIDENCE_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          P1A_RECONCILIATION_BASE_SHA: 5056fb0df6e1ef739231cd2273a453fb1c644273
          P1A_ORIGINAL_CANDIDATE_SHA: 365c59757756f3f91480d3bfeb841b543010201f
          P1A_TRUST_RUNTIME_PIN: ${{ vars.P1A_TRUST_RUNTIME_PIN }}
          P1A_SPEC_GIT_DIR: ${{ github.workspace }}/candidate/.git
        run: |
          set -euo pipefail
          node trusted/scripts/validate-p1a-threat-model.mjs \
            --candidate-sha "$P1A_CANDIDATE_SHA" |
            tee "$RUNNER_TEMP/p1a-certification.log"
          tail -n 1 "$RUNNER_TEMP/p1a-certification.log" \
            > "$RUNNER_TEMP/p1a-certification-summary.json"

      - name: Execute protected real-object integration
        env:
          P1A_PACKAGE_ROOT: ${{ github.workspace }}/candidate
          P1A_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          P1A_WORKFLOW_SHA: ${{ github.workflow_sha }}
          P1A_VERIFIER_SHA: ${{ github.workflow_sha }}
          P1A_TRUST_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          P1A_EVIDENCE_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          P1A_RECONCILIATION_BASE_SHA: 5056fb0df6e1ef739231cd2273a453fb1c644273
          P1A_ORIGINAL_CANDIDATE_SHA: 365c59757756f3f91480d3bfeb841b543010201f
          P1A_TRUST_RUNTIME_PIN: ${{ vars.P1A_TRUST_RUNTIME_PIN }}
          P1A_SPEC_GIT_DIR: ${{ github.workspace }}/candidate/.git
        run: |
          set -euo pipefail
          node trusted/scripts/test-p1a-trusted-verifier.mjs --integration |
            tee "$RUNNER_TEMP/p1a-integration.log"
          tail -n 1 "$RUNNER_TEMP/p1a-integration.log" \
            > "$RUNNER_TEMP/p1a-integration-summary.json"

      - name: Validate fail-closed accounting and digest sanitized evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          EVIDENCE_BASE_SHA: 7056ea4ce24379c93549f0ac9b45ddd7a2600dd6
          RECONCILIATION_BASE_SHA: 5056fb0df6e1ef739231cd2273a453fb1c644273
          ORIGINAL_CANDIDATE_SHA: 365c59757756f3f91480d3bfeb841b543010201f
          RUNTIME_PIN: ${{ vars.P1A_TRUST_RUNTIME_PIN }}
        run: |
          set -euo pipefail
          node trusted/scripts/validate-p1a-certification-accounting.mjs \
            --dual "$RUNNER_TEMP/p1a-dual-base-summary.json" \
            --nested "$RUNNER_TEMP/p1a-certification-summary.json" \
            --integration "$RUNNER_TEMP/p1a-integration-summary.json" \
            --candidate "$CANDIDATE_SHA" \
            --workflow "$WORKFLOW_SHA" \
            --base "$BASE_SHA" \
            --evidence-base "$EVIDENCE_BASE_SHA" \
            --reconciliation-base "$RECONCILIATION_BASE_SHA" \
            --original-candidate "$ORIGINAL_CANDIDATE_SHA" \
            --runtime "$RUNTIME_PIN" \
            --output "$RUNNER_TEMP/p1a-protected-summary.json"
          cd "$RUNNER_TEMP"
          sha256sum p1a-certification-summary.json \
            p1a-integration-summary.json p1a-dual-base-summary.json \
            p1a-protected-summary.json \
            > p1a-certification-summary.sha256

      - name: Upload sanitized certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p1a-certification-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/p1a-certification-summary.json
            ${{ runner.temp }}/p1a-integration-summary.json
            ${{ runner.temp }}/p1a-dual-base-summary.json
            ${{ runner.temp }}/p1a-protected-summary.json
            ${{ runner.temp }}/p1a-certification-summary.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup credential and object material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/zbestmedia-ui.git"
          rm -f "$RUNNER_TEMP/p1a-askpass.sh"
          rm -f "$RUNNER_TEMP/p1a-certification.log"
          rm -f "$RUNNER_TEMP/p1a-integration.log"
          rm -f "$RUNNER_TEMP/p1a-dual-base.log"
