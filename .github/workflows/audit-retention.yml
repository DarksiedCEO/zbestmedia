name: Audit Retention & Verification

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  audit-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify contracts and ledger
        run: |
          pnpm ops:contracts:verify --strict
          pnpm ops:audit:verify-ledger --strict
      - name: Readiness check
        run: pnpm ops:readiness:check --strict
      - name: Rollover ledger (dry approval reason)
        run: pnpm ops:audit:rollover-ledger --approve --reason "scheduled rollover"
      - name: Push immutable artifacts (dry-run unless configured)
        run: pnpm ops:audit:push-immutable
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-retention-${{ github.run_id }}
          path: |
            ops/audit/archive/*
            ops/audit/checkpoints/*
            ops/audit/immutable_upload_manifest.json
            ops/contracts/slo_contracts.json
            ops/contracts/slo_contracts.sig.json
            ops/keys/keyring.json
