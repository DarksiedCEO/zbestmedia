services:
  artifacts_postgres:
    image: postgres:16
    container_name: zbestmedia_artifacts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zbestmedia_artifacts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zbestmedia_artifacts"]
      interval: 3s
      timeout: 3s
      retries: 20
